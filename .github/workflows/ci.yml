name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACTS_NAME: "contracts"
  SIMPLEX_COMMIT: 53087018cd1a8e12c710a44bafc5e32c077edc5a

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Install pinned Simplex CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://smplx.simplicity-lang.org | bash
          SIMPLEX_DIR="${SIMPLEX_DIR:-${XDG_CONFIG_HOME:-$HOME}/.simplex}"
          echo "$SIMPLEX_DIR/bin" >> "$GITHUB_PATH"
          "$SIMPLEX_DIR/bin/simplexup" -C "$SIMPLEX_COMMIT"
          "$SIMPLEX_DIR/bin/simplex" --version

      - name: Generate contract artifacts
        working-directory: contracts
        run: |
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        run: cargo fmt -p high-storm -p storm -p storm-operator -p storm-tree --check

      - name: Run Clippy
        run: >
          cargo clippy --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features -- -D warnings

      - name: Build
        run: >
          cargo build --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features --locked

      - name: Run tests
        run: >
          cargo test --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features --locked
