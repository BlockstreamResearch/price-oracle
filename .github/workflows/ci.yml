name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMPLEX_VERSION: 0.2.0
  SIMPLEX_COMMIT: 299c1e61add3d7b62466399d17eace06005b917b

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      # No Simplex release has SimplicityHL 0.9 yet: simplex is built from the
      # commit the crates pin, and the tools it runs come from the release.
      - name: Cache Simplex CLI
        id: simplex-cache
        uses: actions/cache@v4
        with:
          path: ~/.simplex
          key: simplex-${{ runner.os }}-${{ env.SIMPLEX_VERSION }}-${{ env.SIMPLEX_COMMIT }}

      - name: Install pinned Simplex CLI
        if: steps.simplex-cache.outputs.cache-hit != 'true'
        run: |
          # simplexup installs under $XDG_CONFIG_HOME, which the runners set to
          # ~/.config; keep it where the cache and PATH look.
          export SIMPLEX_DIR="$HOME/.simplex"
          curl -sSfL --retry 5 -o "$RUNNER_TEMP/simplexup" \
            "https://raw.githubusercontent.com/BlockstreamResearch/smplx/${SIMPLEX_COMMIT}/simplexup/simplexup"
          chmod +x "$RUNNER_TEMP/simplexup"
          "$RUNNER_TEMP/simplexup" --install "v${SIMPLEX_VERSION}" --commit "${SIMPLEX_COMMIT}"

      - name: Add Simplex CLI to PATH
        run: echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"

      - name: Generate contract artifacts
        working-directory: contracts
        run: |
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: >
          cargo build --workspace --all-targets --all-features --locked

      - name: Run non-contract tests
        timeout-minutes: 20
        run: >
          cargo test --workspace --exclude contracts --all-targets --all-features --locked

  prometheus:
    name: Prometheus rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check scrape config and alert rules
        working-directory: high-storm/prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.5.0 check config prometheus.yml

      - name: Test alert rules
        working-directory: high-storm/prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.5.0 test rules alerts.test.yml
