name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMPLEX_VERSION: v0.0.10

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Install pinned Simplex CLI (${{ SIMPLEX_VERSION }})
        uses: BlockstreamResearch/simplicityhl-toolchain@v0.0.2
        with:
          components: simplex@${{ SIMPLEX_VERSION }}

      - name: Generate contract artifacts
        working-directory: contracts
        run: |
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: >
          cargo build --workspace --all-targets --all-features --locked

      - name: Run tests
        run: >
          cargo test --workspace --all-targets --all-features --locked
