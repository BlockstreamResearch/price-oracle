name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMPLEX_VERSION: 0.2.0

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Install pinned Simplex CLI
        uses: BlockstreamResearch/simplicityhl-toolchain@v0.0.2
        with:
          components: simplex@${{ env.SIMPLEX_VERSION }}

      - name: Generate contract artifacts
        working-directory: contracts
        run: |
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: >
          cargo build --workspace --all-targets --all-features --locked

      - name: Run non-contract tests
        timeout-minutes: 20
        run: >
          cargo test --workspace --exclude contracts --all-targets --all-features --locked

  prometheus:
    name: Prometheus rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check scrape config and alert rules
        working-directory: high-storm/prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.5.0 check config prometheus.yml

      - name: Test alert rules
        working-directory: high-storm/prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.5.0 test rules alerts.test.yml

  web-sdk:
    name: Web SDK checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: web/sdk
        run: bun install --frozen-lockfile

      - name: Build and test
        working-directory: web/sdk
        run: bun run check

      # dist is committed, so it has to be what the sources build to.
      - name: Check the committed build
        run: git diff --exit-code -- web/sdk/dist
