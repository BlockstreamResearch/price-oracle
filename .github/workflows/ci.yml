name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACTS_NAME: "oracle_contracts"

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt -p high-storm -p storm -p storm-operator -p storm-tree --all --check

      - name: Run Clippy
        run: >
          cargo clippy --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features -- -D warnings

      - name: Build
        run: >
          cargo build --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features --locked

      - name: Run tests
        run: >
          cargo test --workspace --exclude "$CONTRACTS_NAME"
          --all-targets --all-features --locked
