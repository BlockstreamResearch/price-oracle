name: Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Set up after release version and fixed bug with RequiredSignature
  # SIMPLEX_VERSION: 0.0.11
  SIMPLEX_VERSION: 0.0.10

jobs:
  test:
    name: Build and test contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Show toolchain
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install pinned Simplex CLI (${{ SIMPLEX_VERSION }})
        uses: BlockstreamResearch/simplicityhl-toolchain@v0.0.2
        with:
          components: simplex@${{ SIMPLEX_VERSION }}

      - name: Generate contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd contracts
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: contracts
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run simplex tests
        shell: bash
        run: |
          set -euo pipefail
          cd contracts

          # `simplex test` always exits 0: it runs cargo-nextest, prints
          # "Exit Status: <code>" and then returns Ok(()) without propagating the
          # code (crates/cli/src/commands/test.rs). That printed line is the only
          # reliable signal, so read it back out of the log. A missing line means
          # the child was killed by a signal ("Process terminated.") and also fails.
          simplex test --test-threads 2 2>&1 | tee simplex.log

          status=$(grep -Eo 'Exit Status: [0-9]+' simplex.log | tail -1 | grep -Eo '[0-9]+$')
          if [ -z "${status}" ] || [ "${status}" -ne 0 ]; then
            echo "::error::simplex test failed (status=${status:-none})"
            exit 1
          fi
