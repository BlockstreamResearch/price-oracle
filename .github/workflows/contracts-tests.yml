name: Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SIMPLEX_VERSION: 0.2.0
  SIMPLEX_COMMIT: 299c1e61add3d7b62466399d17eace06005b917b

jobs:
  test:
    name: Build and test contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Show toolchain
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No Simplex release has SimplicityHL 0.9 yet: simplex is built from the
      # commit the crates pin, and the tools it runs come from the release.
      - name: Cache Simplex CLI
        id: simplex-cache
        uses: actions/cache@v4
        with:
          path: ~/.simplex
          key: simplex-${{ runner.os }}-${{ env.SIMPLEX_VERSION }}-${{ env.SIMPLEX_COMMIT }}

      - name: Install pinned Simplex CLI
        if: steps.simplex-cache.outputs.cache-hit != 'true'
        run: |
          # simplexup installs under $XDG_CONFIG_HOME, which the runners set to
          # ~/.config; keep it where the cache and PATH look.
          export SIMPLEX_DIR="$HOME/.simplex"
          curl -sSfL --retry 5 -o "$RUNNER_TEMP/simplexup" \
            "https://raw.githubusercontent.com/BlockstreamResearch/smplx/${SIMPLEX_COMMIT}/simplexup/simplexup"
          chmod +x "$RUNNER_TEMP/simplexup"
          "$RUNNER_TEMP/simplexup" --install "v${SIMPLEX_VERSION}" --commit "${SIMPLEX_COMMIT}"

      - name: Add Simplex CLI to PATH
        run: echo "$HOME/.simplex/bin" >> "$GITHUB_PATH"
      
      # simfmt is built on SimplicityHL 0.7 and cannot parse `raw_hash`, so the
      # two sources that use it are left out until a simfmt release can.
      - name: Check contracts formatting
        working-directory: contracts
        run: |
          find simf -name '*.simf' \
            ! -path simf/voucher.simf ! -path simf/lib/taproot.simf -print0 |
            xargs -0 simplex fmt --check

      - name: Generate contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd contracts
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: contracts
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run simplex tests
        shell: bash
        run: |
          set -euo pipefail
          cd contracts

          # `simplex test` always exits 0: it runs cargo-nextest, prints
          # "Exit Status: <code>" and then returns Ok(()) without propagating the
          # code (crates/cli/src/commands/test.rs). That printed line is the only
          # reliable signal, so read it back out of the log. A missing line means
          # the child was killed by a signal ("Process terminated.") and also fails.
          for mode in simplex rust; do
            args=(--test-threads 1)
            if [ "$mode" = rust ]; then
              args+=(--no-simplex)
            fi
            simplex test "${args[@]}" 2>&1 | tee "simplex-$mode.log"

            status=$(grep -Eo 'Exit Status: [0-9]+' "simplex-$mode.log" | tail -1 | grep -Eo '[0-9]+$')
            if [ -z "${status}" ] || [ "${status}" -ne 0 ]; then
              echo "::error::simplex $mode tests failed (status=${status:-none})"
              exit 1
            fi
          done
