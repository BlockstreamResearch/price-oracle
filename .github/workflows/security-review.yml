name: AI Security Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-review:
    # Only run for PR comments, exact command, and your GitHub account.
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/scan-diff' &&
      github.event.comment.user.login == 'ivanlele'

    runs-on: ubuntu-latest

    environment: Security

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json baseRefName,headRefName,baseRefOid,headRefOid \
            > pr.json

          cat pr.json

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr diff "$PR_NUMBER" > pr.diff

          echo "Diff size:"
          wc -c pr.diff

      - name: Run security review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SECURITY_REVIEW_REPORT: security-review.md
        run: |
          python .github/security-review.py

      - name: Comment security review result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMAND_URL: ${{ github.event.comment.html_url }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -s security-review.md ]]; then
            printf '%s\n\n%s\n\n%s\n' \
              '## AI security review' \
              "The review could not produce a report (step outcome: **${REVIEW_OUTCOME}**)." \
              "[View workflow logs](${RUN_URL})" \
              > security-review.md
          fi

          printf '\n---\n[Requested by `/scan-diff`](%s)\n' "$COMMAND_URL" \
            >> security-review.md

          gh pr comment "$PR_NUMBER" --body-file security-review.md