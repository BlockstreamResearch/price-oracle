[workspace]
members = [
    "high-storm",
    "storm",
    "storm-tree",
    "contracts",
]

# Not to use inside docker compose process
# exclude = ["contract"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = "4.6.6"
crossterm = "0.28.1"
hex = "0.4.3"
itertools = "0.14.0"
log = "0.4.33"
monotree = "0.4.0"
postcard = { version = "1.1.3", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
secp256k1 = { git = "https://github.com/rust-bitcoin/rust-secp256k1.git", rev = "secp256k1-0.32.0-beta.2" }
secp256k1-zkp = "0.11.0"
serde = "1.0.229"
sha2 = "0.10"
snow = "0.10.0"
sqlx = { version = "0.8.6", default-features = false }
thiserror = "2.0.20"
tokio = "1.53.1"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.7"

storm = { path = "storm" }
