[package]
name = "high-storm"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
bip322.workspace = true
bitcoin.workspace = true
bitcoincore-rpc.workspace = true
clap = { workspace = true, features = ["derive"] }
getrandom.workspace = true
hex.workspace = true
log.workspace = true
postcard = { workspace = true, features = ["use-std"] }
secp256k1 = { workspace = true, features = ["rand"] }
secp256k1-zkp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["any", "macros", "migrate", "postgres", "sqlite", "runtime-tokio"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

contracts.workspace = true
simplex = { package = "smplx-std", git = "https://github.com/BlockstreamResearch/smplx", rev = "c1e9d8b06231973d81fbaa677cf3f03787104b81" }
storm.workspace = true
storm-tree = { path = "../storm-tree" }

[dev-dependencies]
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
