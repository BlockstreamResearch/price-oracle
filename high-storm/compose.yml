name: high-storm-local

x-node: &node
  build:
    context: ..
    dockerfile: high-storm/Dockerfile
  environment:
    RUST_LOG: ${RUST_LOG:-info,high_storm=debug,storm=debug,sqlx=warn}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    storm:

x-elements-node: &elements-node
  build:
    context: ./docker/elements
    dockerfile: Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "elements-cli", "-chain=elementsregtest", "-rpcconnect=127.0.0.1", "-rpcport=18884", "-rpcuser=high-storm", "-rpcpassword=high-storm", "getblockchaininfo"]
    interval: 2s
    timeout: 3s
    retries: 30
  networks:
    storm:

x-operator-platform: &operator-platform
  build:
    context: ..
    dockerfile: web/operator/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1/"]
    interval: 2s
    timeout: 3s
    retries: 20
  networks:
    storm:

services:
  elements-1:
    <<: *elements-node
    command:
      - -chain=elementsregtest
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.28.0.0/24
      - -rpcport=18884
      - -rpcuser=high-storm
      - -rpcpassword=high-storm
      - -port=18888
      - -bind=0.0.0.0:18888
      - -addnode=elements-2:18888
      - -addnode=elements-3:18888
      - -dnsseed=0
      - -fixedseeds=0
      - -validatepegin=0
      - -initialfreecoins=2100000000000000
      - -con_connect_genesis_outputs=1
      - -con_blocksubsidy=0
      - -anyonecanspendaremine=1
      - -blindedaddresses=0
      - -fallbackfee=0.0001
      - -txindex=1
    volumes:
      - elements-1-data:/home/elements/.elements
    ports:
      - "18884:18884"
    networks:
      storm:
        ipv4_address: 172.28.0.21

  elements-2:
    <<: *elements-node
    command:
      - -chain=elementsregtest
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.28.0.0/24
      - -rpcport=18884
      - -rpcuser=high-storm
      - -rpcpassword=high-storm
      - -port=18888
      - -bind=0.0.0.0:18888
      - -addnode=elements-1:18888
      - -addnode=elements-3:18888
      - -dnsseed=0
      - -fixedseeds=0
      - -validatepegin=0
      - -initialfreecoins=2100000000000000
      - -con_connect_genesis_outputs=1
      - -con_blocksubsidy=0
      - -anyonecanspendaremine=0
      - -blindedaddresses=0
      - -fallbackfee=0.0001
      - -txindex=1
    volumes:
      - elements-2-data:/home/elements/.elements
    ports:
      - "18885:18884"
    networks:
      storm:
        ipv4_address: 172.28.0.22

  elements-3:
    <<: *elements-node
    command:
      - -chain=elementsregtest
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.28.0.0/24
      - -rpcport=18884
      - -rpcuser=high-storm
      - -rpcpassword=high-storm
      - -port=18888
      - -bind=0.0.0.0:18888
      - -addnode=elements-1:18888
      - -addnode=elements-2:18888
      - -dnsseed=0
      - -fixedseeds=0
      - -validatepegin=0
      - -initialfreecoins=2100000000000000
      - -con_connect_genesis_outputs=1
      - -con_blocksubsidy=0
      - -anyonecanspendaremine=0
      - -blindedaddresses=0
      - -fallbackfee=0.0001
      - -txindex=1
    volumes:
      - elements-3-data:/home/elements/.elements
    ports:
      - "18886:18884"
    networks:
      storm:
        ipv4_address: 172.28.0.23

  elements-bootstrap:
    build:
      context: ./docker/elements
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      elements-1:
        condition: service_healthy
      elements-2:
        condition: service_healthy
      elements-3:
        condition: service_healthy
    environment:
      ELEMENTS_RPC_HOST: elements-1
      ELEMENTS_RPC_PORT: 18884
      ELEMENTS_RPC_USER: high-storm
      ELEMENTS_RPC_PASSWORD: high-storm
      BLOCK_INTERVAL_SECONDS: 60
      FUNDED_PRIVATE_KEY: "0101010101010101010101010101010101010101010101010101010101010101"
    entrypoint: ["/bin/bash", "/opt/elements/bootstrap.sh"]
    volumes:
      - ./docker/elements/bootstrap.sh:/opt/elements/bootstrap.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bootstrap-ready"]
      interval: 1s
      timeout: 1s
      retries: 60
    networks:
      storm:
        ipv4_address: 172.28.0.24

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: high-storm
      POSTGRES_PASSWORD: high-storm
      POSTGRES_DB: high-storm-node-1
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-create-node-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U high-storm -d high-storm-node-1"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      storm:
        ipv4_address: 172.28.0.10

  node-1:
    <<: *node
    environment:
      RUST_LOG: ${RUST_LOG:-info,high_storm=debug,storm=debug,sqlx=warn}
      OPERATOR_PUBLIC_KEY: 031b84c5567b126440995d3ed5aaba0565d71e1834604819ff9c17f5e9d5dd078f
    depends_on:
      postgres:
        condition: service_healthy
      elements-1:
        condition: service_healthy
      elements-bootstrap:
        condition: service_healthy
    volumes:
      - ./docker/node-1.toml:/etc/high-storm/config.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (while [ ! -S /tmp/high-storm.sock ]; do sleep 1; done;
        until storm-operator operator add "$${OPERATOR_PUBLIC_KEY}"; do sleep 1; done) &
        high-storm run --config /etc/high-storm/config.toml ||
        exec high-storm initialize host --config /etc/high-storm/config.toml
        --public-key 024d4b6cd1361032ca9bd2aeb9d900aa4d45d9ead80ac9423374c451a7254d0766
        --public-key 02531fe6068134503d2723133227c867ac8fa6c83c537e9a44c3c5bdbdcb1fe337
    ports:
      - "9000:9000"
      - "9100:9100"
    networks:
      storm:
        ipv4_address: 172.28.0.11

  node-2:
    <<: *node
    environment:
      RUST_LOG: ${RUST_LOG:-info,high_storm=debug,storm=debug,sqlx=warn}
      OPERATOR_PUBLIC_KEY: 024d4b6cd1361032ca9bd2aeb9d900aa4d45d9ead80ac9423374c451a7254d0766
    depends_on:
      postgres:
        condition: service_healthy
      node-1:
        condition: service_started
      elements-2:
        condition: service_healthy
    volumes:
      - ./docker/node-2.toml:/etc/high-storm/config.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (while [ ! -S /tmp/high-storm.sock ]; do sleep 1; done;
        until storm-operator operator add "$${OPERATOR_PUBLIC_KEY}"; do sleep 1; done) &
        high-storm run --config /etc/high-storm/config.toml ||
        exec high-storm initialize join --config /etc/high-storm/config.toml
        --discovery-public-key 031b84c5567b126440995d3ed5aaba0565d71e1834604819ff9c17f5e9d5dd078f
        --discovery-address 172.28.0.11:9000
    ports:
      - "9001:9000"
      - "9101:9100"
    networks:
      storm:
        ipv4_address: 172.28.0.12

  node-3:
    <<: *node
    environment:
      RUST_LOG: ${RUST_LOG:-info,high_storm=debug,storm=debug,sqlx=warn}
      OPERATOR_PUBLIC_KEY: 02531fe6068134503d2723133227c867ac8fa6c83c537e9a44c3c5bdbdcb1fe337
    depends_on:
      postgres:
        condition: service_healthy
      node-1:
        condition: service_started
      elements-3:
        condition: service_healthy
    volumes:
      - ./docker/node-3.toml:/etc/high-storm/config.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (while [ ! -S /tmp/high-storm.sock ]; do sleep 1; done;
        until storm-operator operator add "$${OPERATOR_PUBLIC_KEY}"; do sleep 1; done) &
        high-storm run --config /etc/high-storm/config.toml ||
        exec high-storm initialize join --config /etc/high-storm/config.toml
        --discovery-public-key 031b84c5567b126440995d3ed5aaba0565d71e1834604819ff9c17f5e9d5dd078f
        --discovery-address 172.28.0.11:9000
    ports:
      - "9002:9000"
      - "9102:9100"
    networks:
      storm:
        ipv4_address: 172.28.0.13

  operator-1:
    <<: *operator-platform
    environment:
      OPERATOR_API_UPSTREAM: http://node-1:9100
    depends_on:
      node-1:
        condition: service_started
    ports:
      - "9200:80"

  operator-2:
    <<: *operator-platform
    environment:
      OPERATOR_API_UPSTREAM: http://node-2:9100
    depends_on:
      node-2:
        condition: service_started
    ports:
      - "9201:80"

  operator-3:
    <<: *operator-platform
    environment:
      OPERATOR_API_UPSTREAM: http://node-3:9100
    depends_on:
      node-3:
        condition: service_started
    ports:
      - "9202:80"

volumes:
  postgres-data:
  elements-1-data:
  elements-2-data:
  elements-3-data:

networks:
  storm:
    ipam:
      config:
        - subnet: 172.28.0.0/24