[service]
# TCP port used for Storm peer-to-peer traffic.
port = 9000
# Optional IP or DNS endpoint for the coordinator, overriding its persisted address.
# coordinator_address = "coordinator.oracle.svc.cluster.local:9000"
# Optional reachable endpoint for this node, separate from its 0.0.0.0 bind address.
# advertised_address = "node-1.oracle.svc.cluster.local:9000"
# Unix socket used by storm-operator. Use a unique path for each local node.
ipc_path = "/tmp/high-storm.sock"
# Bind address for the operator and user HTTP API. Keep loopback-only unless remote access is required.
external_api_address = "127.0.0.1:9001"

[service.metrics]
# Bind address for the unauthenticated Prometheus endpoint at /metrics. Defaults to
# 127.0.0.1:9300 when omitted. Keep it loopback-only or on a private monitoring network.
address = "127.0.0.1:9300"

# Optional endpoint overrides keyed by members' compressed public keys.
# Configure the required overrides on each node; this does not add network members.
# [service.peer_addresses]
# "02531fe6068134503d2723133227c867ac8fa6c83c537e9a44c3c5bdbdcb1fe337" = "node-3.oracle.svc.cluster.local:9000"

[service.signer]
# 32-byte hex-encoded secp256k1 private key that identifies and signs for this node.
# This example key is public and must never be used in production.
private_key = "804622cda0d8e634317a12651d91751ceff5c081f2b5f63ef7912725c7275e5d"

[service.elements_rpc]
# Full HTTP URL of this node's Elements RPC server.
url = "http://127.0.0.1:18884"
# Elements RPC username.
username = "high-storm"
# Elements RPC password.
password = "high-storm"
# Elements wallet selected for RPC calls that require wallet context.
wallet = "funded-key"

[service.protocol]
# Service fee charged for each output in a submitted user request, in satoshis.
operational_fee_sats = 1000
# LBTC reserve attached to each issued Tick account for its eventual burn, in satoshis.
tick_burn_reserve_sats = 1000
# Fee budget for an aggregate Tick issuance transaction, in satoshis.
issuance_transaction_fee_sats = 1000
# Minimum fee for a Tick burn transaction, in satoshis; larger burns pay Elements' default
# 0.1 sat/vB relay floor on a bounded weight instead. Defaults to 500 when omitted.
burn_transaction_fee_sats = 500
# Fee budget for a Droplets LBTC exchange transaction, in satoshis. Defaults to 500 when omitted.
exchange_transaction_fee_sats = 500
# Tick lifetime measured in blocks. The default 60 blocks is one hour at the target interval.
tick_lifetime_blocks = 60
# Confirmations required before an included transaction becomes final. Defaults to 2.
finality_confirmations = 2

# Leave this section out to poll no price source; such a node attests no prices.
[service.price_sources.coingecko]
# Optional CoinGecko Demo API key. Without one, the public per-IP rate limit applies.
# api_key = ""

[service.db]
# PostgreSQL host and optional port, without a URL scheme.
url = "localhost:5432"
# PostgreSQL username.
username = "high-storm"
# PostgreSQL password.
password = "high-storm"
# PostgreSQL database name.
database = "high-storm"
# Maximum number of connections in the database pool.
max_connections = 5
