# Scrapes the three nodes of the local deployment. Nodes added with
# `devenv.sh deploy-node` are not listed.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: high-storm
    static_configs:
      - targets: ["node-1:9300", "node-2:9300", "node-3:9300"]
